# Общие настройки пайплайна. Описание таблиц и колонок: docs/interfaces.md

paths:
  data_dir: "Материалы к кейсу"
  output_dir: "output"
  # Кэш прочитанных файлов 01–13 (parquet). Сбрасывается сам, если исходный файл изменился.
  cache_dir: "output/cache"
  # Запасной источник лимитов, если в папке с данными нет файла 14.
  limits_fallback: "configs/limits.yaml"
  # Таблица правил воздействия (стадии, исключения, правила с кодами).
  rules: "docs/Правила воздействия ТНС v0.2.xlsx"

validation:
  # Если в колонке файла (номер ЛС, дата, сумма, «Да/Нет») не прочиталось больше этой доли значений,
  # это ошибка и запуск останавливается. Меньше — предупреждение: такие строки убираются.
  # 0.5 выбрано с запасом: в файле 12 сейчас нет номера ЛС у 41 % строк, это пока предупреждение.
  max_lost_share: 0.5

quality:
  # Очистка и отчёт о качестве (tns/data/quality.py, отчёт — output/<ГГГГ-ММ>/quality_report.xlsx).
  # Даты оплат и мер позже этой даты — ошибка выгрузки, строки убираются. null — дата запуска.
  as_of: null
  # ЛС без движения (во всей ОСВ нулевые сальдо, начисления и оплаты, нет оплат и мер) убрать из панели.
  drop_inactive_ls: true
  # Расхождение сальдо между месяцами меньше этой суммы (руб.) — погрешность округления.
  reconcile_tolerance: 0.01
  # Сколько примеров (ЛС) показывать в отчёте по каждой проверке.
  examples: 20

osv:
  # Что делать, если месяц повторяется в шапке ОСВ (сейчас так у второго блока «2026-02»):
  # shift_next — считать повтор следующим месяцем; drop — оставить первый блок; error — остановиться.
  duplicate_month: shift_next

result:
  # «Результат» меры (P-03, P-04): оплачено не меньше share × долга на 01-е число месяца меры
  # в окне после меры. Окно открывается в день меры (если у меры известен только месяц — 1-го числа).
  # Та же доля используется в таргете ML pay30_m (оплаты за месяц).
  share: 0.30        # X: доля долга, 0.30 = 30 %
  # Конец окна (P-04):
  #   month_end      — до конца месяца меры (ответ заказчика 31.10.2026: «до конца месяца, следующего за расчётным»);
  #   next_month_end — до конца следующего месяца;
  #   days           — N дней, считая день меры (N — параметр days).
  # Если окно кончается позже последнего месяца данных, результат пока неизвестен (пусто).
  window: month_end
  days: 30           # N: используется только при window: days

overdue:
  # Срок просрочки (P-02). Пока реализовано только FIFO: оплаты гасят самые старые начисления.
  allocation: fifo
  # Месяцы с нулевым начислением внутри срока:
  # count — считать (месяцы с даты образования долга); skip — не считать (только неоплаченные периоды).
  zero_accrual_months: count

norm:
  # Прокси норматива, пока нет выгрузки заказчика: среднее начисление за месяцы до M.
  proxy_months: 12
  proxy_min_months: 3
