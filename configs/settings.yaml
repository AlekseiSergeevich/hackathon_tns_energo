# Общие настройки пайплайна. Описание таблиц и колонок: docs/interfaces.md

paths:
  data_dir: "Материалы к кейсу"
  output_dir: "output"
  # Кэш прочитанных файлов 01–13 (parquet). Сбрасывается сам, если исходный файл изменился.
  cache_dir: "output/cache"
  # Запасной источник лимитов, если в папке с данными нет файла 14.
  limits_fallback: "configs/limits.yaml"
  # Таблица правил воздействия (стадии, исключения, правила с кодами).
  rules: "docs/Правила воздействия ТНС v0.2.xlsx"

osv:
  # Что делать, если месяц повторяется в шапке ОСВ (сейчас так у второго блока «2026-02»):
  # shift_next — считать повтор следующим месяцем; drop — оставить первый блок; error — остановиться.
  duplicate_month: shift_next

result:
  # Результат (P-03, P-04): доля долга, которую нужно оплатить, и конец окна.
  share: 0.30
  window: month_end  # month_end — конец месяца меры; next_month_end — конец следующего месяца

overdue:
  # Срок просрочки (P-02). Пока реализовано только FIFO: оплаты гасят самые старые начисления.
  allocation: fifo
  # Месяцы с нулевым начислением внутри срока:
  # count — считать (месяцы с даты образования долга); skip — не считать (только неоплаченные периоды).
  zero_accrual_months: count

norm:
  # Прокси норматива, пока нет выгрузки заказчика: среднее начисление за месяцы до M.
  proxy_months: 12
  proxy_min_months: 3
